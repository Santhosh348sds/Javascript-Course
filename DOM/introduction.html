<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1 id="message"></h1>
    <script>
        // Select the element with id "message"
        const messageElement = document.getElementById('message');
        
        // Set the text content of the selected element
        messageElement.innerHTML = 'Hello, DOM!';
    </script>
</body>
</html>
