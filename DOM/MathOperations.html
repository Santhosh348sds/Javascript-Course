<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Operations</title>
</head>
<body>
    <h1>Addition</h1>
    <input id="num1" type="text" />
    <input id="num2" type="text" />
    <button id="submit" type="submit" onclick="add()">Add</button>
    <p id="addResult"></p>

    <h1>Subraction</h1>
    <input id="num3" type="text" />
    <input id="num4" type="text" />
    <button id="submit" type="submit" onclick="sub()">Subract</button>
    <p id="subResult"></p>

    <h1>Multiplication</h1>
    <input id="num5" type="text" />
    <input id="num6" type="text" />
    <button id="submit" type="submit" onclick="mul()">Multiple</button>
    <p id="mulResult"></p>

    <h1>Division</h1>
    <input id="num7" type="text" />
    <input id="num8" type="text" />
    <button id="submit" type="submit" onclick="div()">Divide</button>
    <p id="divResult"></p>

    <script src="MathOper.js"></script>
</body>
</html>
